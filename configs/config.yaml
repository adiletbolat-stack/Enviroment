# =============================================================
#  config.yaml — параметры нагрузки для бенчмаркинга
#  Все CLI-флаги имеют приоритет над этим файлом.
#  Читается через: python src/benchmark.py --config configs/config.yaml
# =============================================================

# ── Параметры прогона ─────────────────────────────────────────
benchmark:
  n_runs: 120            # рабочих измерений после warm-up (≥100 по регламенту)
  seed: 42               # фиксация случайности (numpy + random + PYTHONHASHSEED)
  experiment: rq2_pipeline
  warmup_iterations: 80
  out_dir: results/sample   # Ignored, non-destructive output for sample benchmark runs

task3_load:
  input: data/processed/measurements_load.csv
  metadata: data/processed/measurements_load.meta.json
  levels_rps: [10, 20, 30, 40, 50, 75, 100, 150]
  duration_seconds: 15
  workers: 64
  n_authors: 400

task3_comparison:
  input: data/raw/test_run.jsonl
  n_runs: 120
  warmup_iterations: 80
  seed: 42
  n_authors: 400
  min_words: 100

statistics:
  bootstrap_reps: 2000
  bootstrap_seed: 42

# ── Warm-up ───────────────────────────────────────────────────
warmup:
  min_iters: 50          # минимальный порог до проверки стационарности
  max_iters: 500         # жёсткий лимит (защита от бесконечного прогрева)
  step: 10               # шаг одной итерации проверки
  cv_max: 0.15           # макс. CV (15 %) — разумно для sort()-подобных функций
  drift_max: 0.10        # макс. дрейф между окнами (10 %)

# ── Нагрузочная модель (синтетические данные) ─────────────────
load:
  n_authors: 400         # авторов в синтетическом датасете
  pareto_shape: 1.2      # форма тяжёлого хвоста постов на автора
  lognormal_mu_words: 150  # медиана длины поста (слов)
  lognormal_sigma: 0.7   # дисперсия lognormal
  edge_case_rate: 0.03   # доля строк с инъекцией крайних случаев

# ── Качество данных ────────────────────────────────────────────
quality:
  max_consecutive_errors: 20  # аварийный стоп при подряд идущих ошибках
  min_words: 100         # минимум слов для включения поста в анализ
  max_error_rate_pct: 1.0  # benchmark error-rate guardrail (%)

# ── SLO ───────────────────────────────────────────────────────
slo:
  latency_ms: null       # null = не проверять; число = порог в мс

# ── Пакеты для версионирования в метаданных ──────────────────
metadata:
  track_packages:
    - numpy
    - pandas
    - scipy
    - statsmodels
    - scikit-learn
    - matplotlib
    - praw
