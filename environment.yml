name: ai-companion-markers
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11.9
  - pip=24.0

  # Scientific computing & statistics
  - numpy=1.26.4
  - pandas=2.2.1
  - scipy=1.12.0
  - scikit-learn=1.4.1.post1
  - statsmodels=0.14.1
  - patsy=0.5.6

  # Visualization
  - matplotlib=3.8.3
  - seaborn=0.13.2

  # Configuration & Utilities
  - pyyaml=6.0.1
  - psutil=5.9.8

  # Testing
  - pytest=8.1.1

  # Interactive environment
  - jupyterlab=4.1.5
  - ipykernel=6.29.3
